<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">2-tier Clos fabric (spine–leaf)</text>

  <!-- spine <-> leaf links -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="200" y1="87" x2="120" y2="163"/><line x1="200" y1="87" x2="280" y2="163"/><line x1="200" y1="87" x2="440" y2="163"/><line x1="200" y1="87" x2="600" y2="163"/>
    <line x1="360" y1="87" x2="120" y2="163"/><line x1="360" y1="87" x2="280" y2="163"/><line x1="360" y1="87" x2="440" y2="163"/><line x1="360" y1="87" x2="600" y2="163"/>
    <line x1="520" y1="87" x2="120" y2="163"/><line x1="520" y1="87" x2="280" y2="163"/><line x1="520" y1="87" x2="440" y2="163"/><line x1="520" y1="87" x2="600" y2="163"/>
  </g>

  <!-- leaf <-> host links -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="120" y1="197" x2="104" y2="270"/><line x1="120" y1="197" x2="136" y2="270"/>
    <line x1="280" y1="197" x2="264" y2="270"/><line x1="280" y1="197" x2="296" y2="270"/>
    <line x1="440" y1="197" x2="424" y2="270"/><line x1="440" y1="197" x2="456" y2="270"/>
    <line x1="600" y1="197" x2="584" y2="270"/><line x1="600" y1="197" x2="616" y2="270"/>
  </g>

  <!-- spine switches -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <rect x="155" y="70" width="90" height="34" rx="6"/>
    <rect x="315" y="70" width="90" height="34" rx="6"/>
    <rect x="475" y="70" width="90" height="34" rx="6"/>
  </g>
  <g fill="#1e3a8a" font-size="12" text-anchor="middle">
    <text x="200" y="91">spine 1</text><text x="360" y="91">spine 2</text><text x="520" y="91">spine 3</text>
  </g>

  <!-- leaf switches -->
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.5">
    <rect x="80" y="163" width="80" height="34" rx="6"/>
    <rect x="240" y="163" width="80" height="34" rx="6"/>
    <rect x="400" y="163" width="80" height="34" rx="6"/>
    <rect x="560" y="163" width="80" height="34" rx="6"/>
  </g>
  <g fill="#14532d" font-size="12" text-anchor="middle">
    <text x="120" y="184">leaf 1</text><text x="280" y="184">leaf 2</text><text x="440" y="184">leaf 3</text><text x="600" y="184">leaf 4</text>
  </g>

  <!-- hosts -->
  <g fill="#e2e8f0" stroke="#64748b" stroke-width="1.5">
    <circle cx="104" cy="278" r="8"/><circle cx="136" cy="278" r="8"/>
    <circle cx="264" cy="278" r="8"/><circle cx="296" cy="278" r="8"/>
    <circle cx="424" cy="278" r="8"/><circle cx="456" cy="278" r="8"/>
    <circle cx="584" cy="278" r="8"/><circle cx="616" cy="278" r="8"/>
  </g>

  <!-- row labels -->
  <g fill="#64748b" font-size="11" text-anchor="end">
    <text x="60" y="91">SPINE</text>
    <text x="60" y="184">LEAF</text>
    <text x="60" y="282">HOSTS</text>
  </g>

  <text x="360" y="330" text-anchor="middle" font-size="11" fill="#64748b">Every leaf reaches every spine — any host-to-host path is the same length, and there are many of them.</text>
</svg>
